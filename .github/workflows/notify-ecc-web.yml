name: Notify ecc-web on Release

on:
  push:
    branches: ["main"]

jobs:
  dispatch:
    name: Trigger ecc-web Sync & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to ecc-web
        env:
          ECC_WEB_TOKEN: ${{ secrets.ECC_WEB_TOKEN }}
        run: |
          # Fail loudly. The previous version used `[ ... ] && echo || echo`,
          # which always exits 0 — so a 403 from an expired token printed a
          # failure message and still reported the job green. The dispatch was
          # dead for an unknown number of releases while the badge stayed clean;
          # the site only kept up because deploy.yml also runs on a 10-minute
          # cron, which masked it further.
          if [ -z "$ECC_WEB_TOKEN" ]; then
            echo "::error::ECC_WEB_TOKEN is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi

          STATUS=$(curl -sS -o /tmp/dispatch-body -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $ECC_WEB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sifxprime/ecc-web/dispatches \
            -d '{"event_type":"ecc-release"}')

          echo "Response status: $STATUS"

          if [ "$STATUS" = "204" ]; then
            echo "ecc-web sync triggered."
            exit 0
          fi

          echo "::error::repository_dispatch to sifxprime/ecc-web returned HTTP $STATUS"
          echo "Response body:"
          cat /tmp/dispatch-body || true
          case "$STATUS" in
            401) echo "::error::Token is invalid or expired. Rotate ECC_WEB_TOKEN." ;;
            403) echo "::error::Token lacks permission. A fine-grained PAT needs Contents: read-write on sifxprime/ecc-web; a classic PAT needs the 'repo' scope. Rotate ECC_WEB_TOKEN." ;;
            404) echo "::error::Repo not found, or the token cannot see sifxprime/ecc-web." ;;
          esac
          exit 1
