# Tells ecc-web to rebuild as soon as main changes, instead of waiting for its
# 10-minute cron. The website syncs docs, agents, skills and the changelog from
# THIS repo's main branch, so a push here is what actually makes the site stale.
#
# History worth keeping: an earlier version of this workflow reported green while
# the API returned 403, because it ended in
#
#   [ "$STATUS" = "204" ] && echo ok || echo failed
#
# which exits 0 either way. It silently did nothing for an unknown number of
# releases and nobody noticed, because a green check looks the same as a working
# one. Every failure path below exits non-zero on purpose.
name: Notify ecc-web

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

# Never run two dispatches at once. Only the newest push matters — the site
# rebuilds from main's current state either way, so cancelling a superseded run
# costs nothing.
concurrency:
  group: notify-ecc-web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notify:
    name: Dispatch to ecc-web
    runs-on: ubuntu-latest
    # Forks have no token and must not fail on a push. This is the only skip
    # condition — a missing token on the real repo is an error, not a skip.
    if: github.repository == 'sifxprime/kodelyth-ecc'

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Dispatch ecc-release to ecc-web
        env:
          TOKEN: ${{ secrets.ECC_WEB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::ECC_WEB_TOKEN is not set. The website will fall back to"
            echo "::error::its 10-minute cron, so the site lags but does not break."
            echo "::error::Add a fine-grained PAT with Contents: read-write on"
            echo "::error::sifxprime/ecc-web as the ECC_WEB_TOKEN secret."
            exit 1
          fi

          BODY=$(node -e '
            process.stdout.write(JSON.stringify({
              event_type: "ecc-release",
              client_payload: {
                version: process.env.VERSION,
                sha: process.env.SHA,
                ref: process.env.GITHUB_REF_NAME,
                run: process.env.GITHUB_RUN_ID,
              },
            }));
          ')

          echo "Dispatching ecc-release for v$VERSION (${SHA:0:7})"

          # Separate the body from the status line so a failure can print what
          # GitHub actually said. A bare status code sends you hunting.
          RESPONSE=$(mktemp)
          STATUS=$(curl -sS -o "$RESPONSE" -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sifxprime/ecc-web/dispatches \
            -d "$BODY")

          if [ "$STATUS" = "204" ]; then
            echo "Dispatch accepted (HTTP 204)."
            exit 0
          fi

          echo "::error::Dispatch failed with HTTP $STATUS"
          echo "--- response body ---"
          cat "$RESPONSE"
          echo
          case "$STATUS" in
            401) echo "::error::401 — the token is invalid or expired. Reissue ECC_WEB_TOKEN." ;;
            403) echo "::error::403 — the token is valid but lacks Contents: read-write on sifxprime/ecc-web." ;;
            404) echo "::error::404 — repo not found, or the token cannot see it. A fine-grained PAT must list ecc-web under 'Repository access'." ;;
            422) echo "::error::422 — malformed payload. ecc-web must accept repository_dispatch type 'ecc-release'." ;;
          esac
          exit 1
