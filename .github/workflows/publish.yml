# Fires when a GitHub release is published, and publishes that version to npm.
#
# IMPORTANT: GitHub runs this file FROM THE TAGGED REF, not from the default
# branch. Tag a commit that predates a change here and the release will run the
# OLD workflow. That happened on v2.21.1: the tag pointed at a commit without the
# "already on npm" check below, so the release tried to republish an existing
# version and failed.
#
# Worse, recovering from it is not possible by retagging. This repository has
# immutable releases enabled, so publishing a release permanently reserves its
# tag name — deleting the release does not release the name, and v2.21.1 can
# never be tagged again.
#
# So: always tag a commit that already contains the workflow you want to run.
name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # for npm provenance

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify package version matches release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Run tests before publish
        run: node tests/run-all.js

      # npm refuses to publish over an existing version, so a release created for
      # a version already on the registry would fail here with a 403 that means
      # "already done", not "broken". Versions have been published by hand from a
      # workstation, so cutting a GitHub release after the fact is the normal
      # case, not an error. Detect it and skip.
      - name: Is this version already on npm?
        id: exists
        run: |
          set -uo pipefail
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$PKG@$VER is already on npm — skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "$PKG@$VER not on npm — will publish."
          fi

      - name: Publish to npm
        if: steps.exists.outputs.already == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Phase 2.9: SLSA / SBOM ───────────────────────────────────────────
      # npm publish above already issues SLSA Level 3 build provenance via
      # npm's sigstore integration (--provenance). Below we additionally emit a
      # CycloneDX SBOM and a content manifest, both attached to the release.
      - name: Generate CycloneDX SBOM
        run: node bin/kodelyth-ecc.js sbom --out kodelyth-ecc-sbom.cdx.json

      - name: Generate content manifest
        run: node bin/kodelyth-ecc.js manifest --out kodelyth-ecc-manifest.json

      # These were uploaded as RELEASE assets. That cannot work on this
      # repository: immutable releases is enabled, and GitHub rejects asset
      # uploads to an already-published release with
      #   HTTP 422: Cannot upload assets to an immutable release.
      # This workflow runs on release:published — by definition after the point
      # assets can be attached — so the step could never have succeeded here,
      # whatever permissions it was given. (It also had contents:read, which
      # would have failed it with a 403 first.)
      #
      # Workflow artifacts instead: same files, downloadable from the run,
      # retained 90 days, and no dependency on release mutability. npm publish
      # --provenance above already issues the SLSA attestation, so the release
      # page is not the only record.
      - name: Upload SBOM + manifest as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-manifest-${{ github.ref_name }}
          path: |
            kodelyth-ecc-sbom.cdx.json
            kodelyth-ecc-manifest.json
          if-no-files-found: error
