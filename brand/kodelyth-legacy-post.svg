<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Space Grotesk','Inter',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="lift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161a18"/>
      <stop offset="34%" stop-color="#0a0d0c"/>
      <stop offset="100%" stop-color="#080a09"/>
    </linearGradient>
    <radialGradient id="glowE" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#065f46" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#080a09" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground: near-black, subtle top lift + one emerald glow low -->
  <rect width="1080" height="1350" fill="url(#lift)"/>
  <rect width="1080" height="1350" fill="url(#glowE)"/>

  <!-- ── Header: Kodelyth lockup (white » mark + wordmark) ── -->
  <g transform="translate(80,58) scale(0.26)" fill="none" stroke="#F4F6F5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="28,4 84,100 28,196" stroke-width="10" stroke-opacity="0.20"/>
    <polyline points="72,0 160,100 72,200" stroke-width="32"/>
  </g>
  <text x="140" y="98" fill="#F4F6F5" font-size="30" font-weight="700" letter-spacing="4">KODELYTH</text>
  <text x="1000" y="96" fill="#8A9691" font-size="15" font-weight="500" letter-spacing="4" text-anchor="end">AI RESEARCH · BANGLADESH</text>
  <rect x="80" y="150" width="920" height="1.5" fill="#F4F6F5" fill-opacity="0.10"/>

  <!-- ── Eyebrow ── -->
  <rect x="80" y="452" width="34" height="4" rx="2" fill="#34D399"/>
  <text x="128" y="470" fill="#34D399" font-size="22" font-weight="600" letter-spacing="6">WHEN THE FINAL WHISTLE BLOWS</text>

  <!-- ── Headline ── -->
  <text x="78" y="560" fill="#C9D6D0" font-size="52" font-weight="500" letter-spacing="0.5">Cheer for 90 minutes.</text>
  <text x="74" y="700" fill="#F7FAF9" font-size="120" font-weight="700" letter-spacing="-2">BUILD FOR</text>
  <text x="74" y="820" fill="#F7FAF9" font-size="120" font-weight="700" letter-spacing="-2">A LIFETIME.</text>
  <rect x="78" y="852" width="180" height="5" rx="2.5" fill="#34D399"/>

  <!-- ── Sub ── -->
  <text x="80" y="928" fill="#AFBBB6" font-size="31" font-weight="400">The World Cup ends today — we kept building.</text>

  <!-- ── Veltix product badge (emerald Descent-V mark + wordmark) ── -->
  <rect x="80" y="990" width="512" height="72" rx="36" fill="#10B981" fill-opacity="0.09" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.5"/>
  <g transform="translate(112,1004) scale(0.19)" fill="none" stroke="#34D399" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4,0 100,56 196,0" stroke-width="10" stroke-opacity="0.25"/>
    <polyline points="0,44 100,132 200,44" stroke-width="32"/>
  </g>
  <text x="172" y="1035" fill="#FFFFFF" font-size="23" font-weight="700" letter-spacing="1">VELTIX V1  ·  VELTIX V1 PRO</text>
  <text x="628" y="1035" fill="#34D399" font-size="21" font-weight="500" letter-spacing="0.5">now going worldwide</text>

  <!-- ── Footer ── -->
  <rect x="80" y="1250" width="920" height="1.5" fill="#F4F6F5" fill-opacity="0.10"/>
  <g transform="translate(80,1276) scale(0.13)" fill="none" stroke="#F4F6F5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="28,4 84,100 28,196" stroke-width="10" stroke-opacity="0.20"/>
    <polyline points="72,0 160,100 72,200" stroke-width="32"/>
  </g>
  <text x="118" y="1300" fill="#F4F6F5" font-size="21" font-weight="700" letter-spacing="3">KODELYTH</text>
  <text x="1000" y="1300" fill="#8A9691" font-size="20" font-weight="400" text-anchor="end">Built to build everything.</text>
</svg>
