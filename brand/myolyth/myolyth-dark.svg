<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120"
     font-family="'Space Grotesk','Inter',system-ui,-apple-system,sans-serif">

  <!-- Myolyth Mark — Ascent (orange on dark) -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="#F97316">
    <!-- ghost — trailing below.
         Set as an explicit tint, NOT as stroke-opacity. Opacity composites
         toward the surface, so on near-black the orange ghost turned muddy
         brown and read as a shadow, while the light lockup's ghost reads as a
         pale tint. Same rule, opposite direction, two logos that look unalike.
         #F0B585 restores the light version's relationship: a faded, lighter
         version of the solid in the same hue. -->
    <polyline points="56,83 73,57 90,83"
              stroke-width="4" stroke="#F0B585"/>
    <!-- solid — apex driving up -->
    <polyline points="50,74 73,37 96,74"
              stroke-width="12"/>
  </g>

  <!-- Wordmark — vertically centered on mark axis (y=60) -->
  <text x="126" y="73"
        font-size="36" font-weight="700" fill="#F4F6F5"
        letter-spacing="3">MYOLYTH</text>

</svg>
