<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- Myolyth favicon — optimized for small sizes: bolder solid, ghost lifted so it survives downscale -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>

  <g stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="#F97316">
    <!-- ghost as an explicit tint (see myolyth-dark.svg). Brighter than the
         old 0.58 opacity, so it survives the downscale to 16px more easily. -->
    <polyline points="154,329 256,271 358,329"
              stroke-width="16" stroke="#F0B585"/>
    <polyline points="146,275 256,183 366,275"
              stroke-width="52"/>
  </g>

</svg>
