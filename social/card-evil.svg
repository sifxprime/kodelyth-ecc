<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
  <marker id="ae" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 Z" fill="#f87171" opacity="0.85"/></marker></defs>
  <rect width="680" height="520" rx="18" fill="url(#bg)"/><rect width="680" height="520" rx="18" fill="none" stroke="#21262d" stroke-width="1.5"/>
  <rect x="40" y="40" width="160" height="26" rx="13" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-opacity="0.45"/>
  <text x="120" y="57" font-size="12" fill="#fca5a5" text-anchor="middle" font-weight="700" letter-spacing="1.5">EVIL MODE</text>
  <text x="40" y="112" font-size="30" font-weight="800" fill="#ffffff">Attacks your code,</text>
  <text x="40" y="150" font-size="30" font-weight="800" fill="#ffffff">then refutes itself</text>
  <text x="40" y="184" font-size="14.5" fill="#8b949e">8 hunters · scored findings · false positives killed on sight.</text>
  <!-- hunt -> verify -> survive -->
  <rect x="40" y="216" width="180" height="58" rx="10" fill="#f87171" fill-opacity="0.09" stroke="#f87171" stroke-opacity="0.35"/>
  <text x="130" y="240" font-size="13" fill="#fca5a5" text-anchor="middle" font-weight="800">HUNT</text>
  <text x="130" y="260" font-size="10.5" fill="#fca5a5" text-anchor="middle" opacity="0.75">8 agents, parallel</text>
  <line x1="224" y1="245" x2="248" y2="245" stroke="#f87171" stroke-width="1.8" marker-end="url(#ae)" opacity="0.7"/>
  <rect x="252" y="216" width="180" height="58" rx="10" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="342" y="240" font-size="13" fill="#c4b5fd" text-anchor="middle" font-weight="800">VERIFY</text>
  <text x="342" y="260" font-size="10.5" fill="#c4b5fd" text-anchor="middle" opacity="0.8">"prove it or it's refuted"</text>
  <line x1="436" y1="245" x2="460" y2="245" stroke="#f87171" stroke-width="1.8" marker-end="url(#ae)" opacity="0.7"/>
  <rect x="464" y="216" width="176" height="58" rx="10" fill="#059669" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="552" y="240" font-size="13" fill="#34d399" text-anchor="middle" font-weight="800">SURVIVORS</text>
  <text x="552" y="260" font-size="10.5" fill="#34d399" text-anchor="middle" opacity="0.8">real, reproducible</text>
  <!-- scoring formula -->
  <rect x="40" y="296" width="600" height="62" rx="12" fill="#0a0c10" stroke="#30363d"/>
  <text x="60" y="320" font-size="11.5" fill="#6e7681" letter-spacing="1">RISK SCORE</text>
  <text x="60" y="344" font-size="14" font-family="monospace" fill="#e5e7eb">severity × confidence × exploitability</text>
  <text x="616" y="344" font-size="11.5" fill="#6e7681" text-anchor="end">noise sinks, exploits float</text>
  <g font-size="13" fill="#8b949e"><text x="40" y="394">✓ A finding you can't reproduce is refuted, not reported</text><text x="40" y="422">✓ Loops until 2 rounds surface nothing new</text><text x="40" y="450">✓ Refuted issues never waste GOD mode's next round</text><text x="40" y="478">✓ /evil-mode --all · --pre-public · --pre-launch</text></g>
  <g transform="translate(600,48) scale(0.2)" opacity="0.16"><polyline points="-44,4 12,100 -44,196" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="0,0 88,100 0,200" stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
</svg>
