<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
  <marker id="ag" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 Z" fill="#fbbf24" opacity="0.85"/></marker></defs>
  <rect width="680" height="520" rx="18" fill="url(#bg)"/><rect width="680" height="520" rx="18" fill="none" stroke="#21262d" stroke-width="1.5"/>
  <rect x="40" y="40" width="150" height="26" rx="13" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.45"/>
  <text x="115" y="57" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="700" letter-spacing="1.5">GOD MODE</text>
  <text x="40" y="112" font-size="30" font-weight="800" fill="#ffffff">Builds it properly,</text>
  <text x="40" y="150" font-size="30" font-weight="800" fill="#ffffff">then proves it</text>
  <text x="40" y="184" font-size="14.5" fill="#8b949e">6-stage pipeline · 9 specialists · nothing ships unproven.</text>
  <!-- pipeline -->
  <g font-size="11.5" font-weight="700" text-anchor="middle">
    <rect x="40"  y="214" width="96" height="44" rx="9" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/><text x="88" y="234" fill="#c4b5fd">Recall</text><text x="88" y="250" font-size="9" fill="#c4b5fd" opacity="0.7">memory</text>
    <rect x="146" y="214" width="96" height="44" rx="9" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.35"/><text x="194" y="234" fill="#fbbf24">Design</text><text x="194" y="250" font-size="9" fill="#fbbf24" opacity="0.7">∥ 2 agents</text>
    <rect x="252" y="214" width="96" height="44" rx="9" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.35"/><text x="300" y="234" fill="#fbbf24">Build</text><text x="300" y="250" font-size="9" fill="#fbbf24" opacity="0.7">test-first</text>
    <rect x="358" y="214" width="106" height="44" rx="9" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-opacity="0.35"/><text x="411" y="234" fill="#fca5a5">Critique</text><text x="411" y="250" font-size="9" fill="#fca5a5" opacity="0.7">∥ self-attack</text>
    <rect x="474" y="214" width="80" height="44" rx="9" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.35"/><text x="514" y="234" fill="#fbbf24">Harden</text><text x="514" y="250" font-size="9" fill="#fbbf24" opacity="0.7">∥ 2</text>
    <rect x="564" y="214" width="76" height="44" rx="9" fill="#059669" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5"/><text x="602" y="234" fill="#34d399">Prove</text><text x="602" y="250" font-size="9" fill="#34d399" opacity="0.8">runs it</text>
  </g>
  <!-- proof gate -->
  <rect x="40" y="288" width="600" height="76" rx="12" fill="#0a0c10" stroke="#30363d"/>
  <text x="60" y="314" font-size="12" fill="#6e7681" letter-spacing="1">THE PROOF GATE</text>
  <text x="60" y="338" font-size="13.5" font-family="monospace" fill="#34d399">$ npm test  → exit 0 ✓ verified</text>
  <text x="60" y="356" font-size="12" fill="#f87171">"should work" → round NOT complete, fix and re-run</text>
  <g font-size="13" fill="#8b949e"><text x="40" y="400">✓ Recalls past solutions before designing anything new</text><text x="40" y="428">✓ Self-critiques before the adversary ever sees it</text><text x="40" y="456">✓ An artifact counts only when a command actually passed</text><text x="40" y="484">✓ Consumes EVIL findings as mandatory work items</text></g>
  <g transform="translate(600,48) scale(0.2)" opacity="0.16"><polyline points="-44,4 12,100 -44,196" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="0,0 88,100 0,200" stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
